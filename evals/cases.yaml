# Eval 用例清单（手写，期望标签在这里）。故障名见 evals/faults.py。
#
# 期望标签在运行之前写定：跑出来对不上就如实报告，不能回头改标签让它对上。
# - group: single_step | cross_step | human | clean
# - expected.termination: ok | error | escalated | rejected | empty | validation_failed | budget_exhausted
# - expected.error_code: 可选；expected.target_step: 图节点名 / "human" / null（clean 组）
#
# split 分配规则（T-015）：cross_step 与 human 两组各自按 id 字典序排序，奇数位进 dev、
# 偶数位进 test（这样两份里每类故障都有）；其余组一律 test（它们不调用 Agent，放哪边不影响）。
# dev 用于调提示词，test 只用于报告最终数字（调提示词时不看 test）。
#
# T-018 扩充：cross_step 与 human 各 18 条（原 6 + 新 12），合计 36 条，dev / test 各 18。
# 新增故障的 id 前缀保证排序在原有 id 之后，原有 12 条的 split 不变：
# - cross_step 新增 F-OUT-MISS-*（y_outliers_one_feature_missing）、F-OUT-NOISE-*（y_outliers_with_noise）；
# - human 新增 F-YNOISE-*（y_outliers_heavy_noise）、F-YNONLIN-*（nonlinear_target）、F-YPART-*（y_outliers_partial）。
# 所有 cross_step / human 用例的标签都经 evals/label_check.py 实际核验过（tests/eval/test_label_check.py）。

