# 检索评测·困难课题集 v2（2026-10-14，Claude 拟定，gu 同意做）。
#
# 为什么要有这一套：v1 的 20 个课题用的都是标准术语，三种方法找回的候选约 87% 相关，
# 对照组前 5 条大多已经相关，测不出"改写查询"有没有用（见 gate2/retrieval-eval-20261013.md）。
#
# 困难来自"课题怎么说"和"文献怎么叫"之间的距离，四类各约 5 条：
#   A 口语描述现象，不说术语（研究者知道问题，不知道它叫什么）
#   B 跨领域：同一个概念在别的领域另有名字
#   C 字面撞词：关键词在别的领域有大量无关文献（假朋友）
#   D 窄交叉：必须同时满足两个条件才算相关
#
# 公平性规则（重要）：
#   - topic_en 是 topic 的**逐字直译**，不替对照组把口语换成术语；否则对照组白得了一次"改写"。
#   - note 写的是领域术语，只用于事后解读，不进候选池、标注表和任何模型的输入。
#   - 课题、评委提示词、判定标准与 v1 相同；只换课题。v1 的 pool.json 等文件不动。
- id: h01
  topic: 模型在一家医院的数据上效果很好，换到另一家医院就明显变差
  topic_en: model performs well on one hospital's data but becomes much worse at another hospital
  note: A；dataset shift / external validation / domain generalization
- id: h02
  topic: 问卷里有人不认真作答、乱选选项，怎么从数据里把这些人找出来
  topic_en: how to find people in survey data who answer carelessly or choose options randomly
  note: A；careless / insufficient effort responding
- id: h03
  topic: 训练数据的标签里混进了错的，怎么让模型不被带偏
  topic_en: training data labels contain wrong ones, how to keep the model from being misled
  note: A；learning with noisy labels
- id: h04
  topic: 用以前的数据训练的模型，过一段时间预测就不准了
  topic_en: a model trained on earlier data becomes inaccurate after some time
  note: A；concept drift（与 h16 互为假朋友）
- id: h05
  topic: 多做几次检验总能找到一个显著的结果，这样得出的结论靠不住
  topic_en: doing more tests can always find a significant result, so such conclusions are unreliable
  note: A；multiple comparisons / p-hacking
- id: h06
  topic: 实验组和对照组本来就不一样时，怎么公平地比较处理效果
  topic_en: how to fairly compare treatment effects when the treatment and control groups were different to begin with
  note: B；propensity score / causal inference with observational data
- id: h07
  topic: 化学实验里用机器学习决定下一步做哪个实验
  topic_en: using machine learning in chemistry experiments to decide which experiment to do next
  note: B；Bayesian optimization / active learning / self-driving laboratory
- id: h08
  topic: 不同实验室测同一类样本结果不一致，怎么把数据合并起来分析
  topic_en: different laboratories measure the same kind of samples with inconsistent results, how to merge the data for analysis
  note: B；batch effect correction / data harmonization (ComBat)
- id: h09
  topic: 只有确定的正样本和大量没标注的样本，没有确定的负样本，怎么训练分类器
  topic_en: how to train a classifier with only confirmed positive samples and many unlabeled samples but no confirmed negatives
  note: B；positive-unlabeled (PU) learning
- id: h10
  topic: 研究者分析数据时做的各种小选择，会让最后的结论差很多
  topic_en: the various small choices researchers make when analyzing data can make the final conclusions differ a lot
  note: B；garden of forking paths / multiverse analysis / many-analysts
- id: h11
  topic: 文本模型里的“注意力”能不能当作模型做决定的解释
  topic_en: can "attention" in text models be used as an explanation of how the model makes decisions
  note: C；attention as explanation（假朋友：心理学注意力）
- id: h12
  topic: 传感器读数慢慢偏离真实值，需要定期修正
  topic_en: sensor readings gradually deviate from true values and need periodic correction
  note: C；sensor drift calibration（假朋友：机器学习 concept drift）
- id: h13
  topic: 用模型生成的数据再去训练模型，模型会不会越来越差
  topic_en: if models are trained again on data generated by models, will the models get worse and worse
  note: C；model collapse / training on synthetic data（假朋友：生成数据增强的正面结果）
- id: h14
  topic: 特征之间高度相关时，特征重要性排名会误导人
  topic_en: when features are highly correlated, feature importance rankings are misleading
  note: C；permutation importance with correlated features（假朋友：多重共线性的回归教材文献）
- id: h15
  topic: 让大模型说出它对自己答案有多大把握，而且这个把握要靠得住
  topic_en: let large models say how confident they are in their answers, and the confidence should be reliable
  note: C；LLM calibration / verbalized confidence（假朋友：人类自信心研究）
- id: h16
  topic: 地理位置相近的样本，在交叉验证里会让模型评估结果偏乐观
  topic_en: samples that are close in geographic location make model evaluation results too optimistic in cross-validation
  note: D；spatial autocorrelation + cross-validation
- id: h17
  topic: 测试题可能早就出现在大语言模型的训练数据里，导致评测分数虚高
  topic_en: test questions may have already appeared in the training data of large language models, making evaluation scores inflated
  note: D；benchmark / data contamination
- id: h18
  topic: 同一个人的多次测量数据，不能当成独立样本来做机器学习评估
  topic_en: repeated measurements from the same person cannot be treated as independent samples in machine learning evaluation
  note: D；subject-wise split / data leakage / pseudoreplication
- id: h19
  topic: 从科研论文的 PDF 里自动把表格中的数字抽取出来
  topic_en: automatically extracting numbers in tables from PDF files of scientific papers
  note: D；table extraction from scientific documents
- id: h20
  topic: 小样本临床数据上，深度学习不一定比逻辑回归好
  topic_en: on small clinical datasets, deep learning is not necessarily better than logistic regression
  note: D；ML vs logistic regression clinical prediction comparison
